<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon/icons8-screaming-rooster-32.png">
  <link rel="preload" as="image" href="img/5_background/desert-landscape.jpg" fetchpriority="high">

  <title>El Pollo Loco</title>

  <!-- Utils -->
  <script defer src="audio/sound.manager.js"></script>
  <script defer src="utils/aabb.js"></script>

  <!-- Baseclasses -->
  <script defer src="classes/movable-object.class.js"></script>
  <script defer src="classes/statusbar.class.js"></script>

  <!-- Rendering/Background -->
  <script defer src="classes/background-object.class.js"></script>
  <script defer src="classes/character.class.js"></script>

  <!-- Level & World -->
  <script defer src="classes/world.core.js"></script>

  <script defer src="classes/world.render.js"></script>
  <script defer src="classes/world.audio.js"></script>
  <script defer src="classes/world.controls.js"></script>
  <script defer src="classes/world.physics.js"></script>
  <script defer src="classes/world.items.js"></script>
  <script defer src="classes/world.enemies.js"></script>
  <script defer src="classes/world.combat.js"></script>


  <script defer src="classes/keyboard.class.js"></script>
  <script defer src="classes/level.class.js"></script>
  <script defer src="classes/cloud.class.js"></script> 

  <!-- Entities & Items -->
  <script defer src="classes/collectibles.class.js"></script>
  <script defer src="classes/projectile.class.js"></script>
  <script defer src="classes/smallchicken.class.js"></script>
  <script defer src="classes/chicken.class.js"></script>
  <script defer src="classes/endboss.class.js"></script>

  <script defer src="templates/start-screen.template.js"></script>
  <script defer src="templates/howto-modal.template.js"></script>
  <script defer src="templates/end-screen-template.js"></script>

  <script defer src="js/game.init.js"></script>
  <script defer src="js/game.ui.js"></script>
  <script defer src="js/game.audio-ui.js"></script>
  <script defer src="js/game.fullscreen.js"></script>
  <script defer src="js/game.hud.js"></script>
  <script defer src="js/game.orientation.js"></script>
</head>

<body onload="init()">

  <div id="rotateDeviceScreen" class="rotate-device-overlay">
    <div class="rotate-content">
      <span>Please turn your device to play</span>
      <div class="rotate-icon">🔄</div>
    </div>
  </div>

  <div id="bg" aria-hidden="false">
    <h1>El pollo loco</h1>

    <div id="hudActions" class="hud-fab-container">
      <div class="hud-fab hud-volume-wrapper">
        <button id="btnMute" class="hud-btn-reset" aria-label="Mute">🔊</button>
        <div class="vol-panel">
          <div id="volPct">60%</div>
          <div class="slider-wrap">
            <input id="volSlider" type="range" min="0" max="100" value="60"
              style="writing-mode: vertical-lr; direction: rtl">
          </div>
        </div>
      </div>

      <button id="btnPause" class="hud-fab" title="Pause">⏸</button>
      <button id="btnStop" class="hud-fab" title="Stop">■</button>
      <button id="btnRestart" class="hud-fab" title="Restart">⟲</button>
      <button id="btnFullscreen" class="hud-fab" title="Vollbild">⛶</button>

      <button class="hud-fab htp-fab" id="btnHowToFab" type="button" title="Anleitung">❔</button>

    </div>

    <div id="game">
      <canvas id="canvas" width="720" height="480">
      </canvas>

    </div>
  </div>
</body>

</html>
